# AssetManager · 构建与测试（P3 T37）
#
# 和 FontManager 那套**不共用流水线**：两个软件各自独立仓、独立 tag、独立 Release。
# 这里只做三件事：前端类型检查 + 构建、core 单测、Windows 打包（NSIS）。
# 打 tag（v*）时额外把安装包挂到 GitHub Release —— 走官方 Release API，
# 不手工推 tag、不手工传资产（那条路会被 CI 覆盖，FontManager 上踩过）。
#
# 供应链约束（P2）：
#   · 所有第三方 action 钉到 **commit SHA**（tag 可以被上游移动，SHA 不会）；
#     注释里保留原版本号，升级时按 SHA 换。
#   · 顶层 `permissions: contents: read`；只有 release 这一个 job 拿 write。
#   · checkout 一律 `persist-credentials: false`：`GITHUB_TOKEN` 不再写进 .git/config，
#     `npm ci` 的 postinstall 也就读不到可写的 token。
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # 目标平台只有 Windows（AM-E02：索引/缩略图/拖拽都压在 Win32 上）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 装 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 前端依赖
        run: npm ci
        working-directory: app

      - name: 类型检查 + 前端构建
        run: npm run build
        working-directory: app

      - name: 装 Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable 分支
        with:
          toolchain: stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            core -> target
            src-tauri -> target

      - name: core 单测
        run: cargo test --release
        working-directory: core

      # 更新器的单测（update::tests）在 src-tauri 里，core 那条跑不到 ——
      # 0.1.35 时才补上这条，否则自动更新的闸门（白名单/版本比较/资产名）永远没人测。
      - name: src-tauri 单测
        run: cargo test --release
        working-directory: src-tauri

      - name: 打包（NSIS）
        # 前端已经在上一步构建好了，这里把 beforeBuildCommand 清空，
        # 免得 tauri 再从错误的目录里跑一遍 npm run build。
        run: ./app/node_modules/.bin/tauri build --config '{"build":{"beforeBuildCommand":""}}'

      - name: 收集产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AssetManager-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  # 发布单独一个 job：build 只读（npm ci / cargo 都能看到 token），
  # 写权限只在这一步、只碰 Release。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: AssetManager-setup
          path: dist

      - name: 发布到 Release（仅 tag，draft 等人工确认）
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*.exe
