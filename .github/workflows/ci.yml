# AssetManager · 构建与测试（P3 T37）
#
# 和 FontManager 那套**不共用流水线**：两个软件各自独立仓、独立 tag、独立 Release。
# 这里只做三件事：前端类型检查 + 构建、core 单测、Windows 打包（NSIS）。
# 打 tag（v*）时额外把安装包挂到 GitHub Release —— 走官方 Release API，
# 不手工推 tag、不手工传资产（那条路会被 CI 覆盖，FontManager 上踩过）。
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 目标平台只有 Windows（AM-E02：索引/缩略图/拖拽都压在 Win32 上）
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 前端依赖
        run: npm ci
        working-directory: app

      - name: 类型检查 + 前端构建
        run: npm run build
        working-directory: app

      - name: 装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core -> target
            src-tauri -> target

      - name: core 单测
        run: cargo test --release
        working-directory: core

      # 更新器的单测（update::tests）在 src-tauri 里，core 那条跑不到 ——
      # 0.1.35 时才补上这条，否则自动更新的闸门（白名单/版本比较/资产名）永远没人测。
      - name: src-tauri 单测
        run: cargo test --release
        working-directory: src-tauri

      - name: 打包（NSIS）
        # 前端已经在上一步构建好了，这里把 beforeBuildCommand 清空，
        # 免得 tauri 再从错误的目录里跑一遍 npm run build。
        run: ./app/node_modules/.bin/tauri build --config '{"build":{"beforeBuildCommand":""}}'

      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: AssetManager-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      # 只有打 tag 才发 Release。draft 先建好，等人工确认后点发布。
      - name: 发布到 Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/*.exe
