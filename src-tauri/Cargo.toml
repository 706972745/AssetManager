[package]
name = "assetmanager"
version = "0.3.20"
description = "AssetManager · 百万级素材管理器"
authors = ["AssetManager"]
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 生产包必须带这个：否则 exe 会去连 devUrl（localhost:1430）而不是内嵌 dist
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
am-core = { path = "../core" }
rfd = "0.17.2"
# F1/F3/Alt+F1 是**系统级**快捷键（软件不在前台也要能截），必须走系统注册
tauri-plugin-global-shortcut = "2"
drag = "2.1.1"
# 截图的裁剪结果走 base64 回前端当 canvas 底图（data: URL 不会污染画布，
# 跨域的自定义协议会把 toDataURL 卡死）
base64 = "0.22"
# 检查更新 / 下载安装包（照 FontManager）：GitHub Releases API 与镜像直链都是 https，
# 默认特性关掉、只留 rustls（不带系统 OpenSSL 依赖，打包机不用装 SDK）；
# `blocking` 是给下载线程用的 —— 下载在主线程会把界面冻住，见 update.rs
reqwest = { version = "0.13.5", default-features = false, features = ["json", "blocking", "rustls"] }
# 安装包校验：只信 GitHub Asset 的 digest，下完与安装前各算一次
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
