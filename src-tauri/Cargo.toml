[package]
name = "assetmanager"
version = "0.1.28"
description = "AssetManager · 百万级素材管理器"
authors = ["AssetManager"]
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 生产包必须带这个：否则 exe 会去连 devUrl（localhost:1430）而不是内嵌 dist
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
am-core = { path = "../core" }
rfd = "0.17.2"
# F1/F3/Alt+F1 是**系统级**快捷键（软件不在前台也要能截），必须走系统注册
tauri-plugin-global-shortcut = "2"
drag = "2.1.1"
# 截图的裁剪结果走 base64 回前端当 canvas 底图（data: URL 不会污染画布，
# 跨域的自定义协议会把 toDataURL 卡死）
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
