[package]
name = "assetmanager"
version = "0.4.28"
description = "AssetManager · 百万级素材管理器"
authors = ["AssetManager"]
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 生产包必须带这个：否则 exe 会去连 devUrl（localhost:1430）而不是内嵌 dist
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
# 托盘（「关闭到托盘」/ 托盘菜单）+ 从内置 PNG 造图标，都在这两个 feature 里。
# `image-png` 必须开：托盘图标来自 `default_window_icon()`，关掉这个 feature
# `TrayIconBuilder::icon` 收不到 `Image`。
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
am-core = { path = "../core" }
rfd = "0.17.2"
# F1/F3/Alt+F1 是**系统级**快捷键（软件不在前台也要能截），必须走系统注册
tauri-plugin-global-shortcut = "2"
# 开机自动启动：官方插件直接写注册表 HKCU\...\Run，比手写 Win32 稳（卸载时也能清干净）
tauri-plugin-autostart = "2"
# 0.4.12 起走本地 vendor：原版只给单一 COPY/MOVE 语义，拖到资源管理器永远是复制；
# 本地补丁让 Copy 模式同时允许 COPY|MOVE，落点自己选（同盘=移动，跨盘/其他软件=复制）
drag = { path = "vendor/drag" }
# 截图的裁剪结果走 base64 回前端当 canvas 底图（data: URL 不会污染画布，
# 跨域的自定义协议会把 toDataURL 卡死）
base64 = "0.22"
# 检查更新 / 下载安装包（照 FontManager）：GitHub Releases API 与镜像直链都是 https，
# 默认特性关掉、只留 rustls（不带系统 OpenSSL 依赖，打包机不用装 SDK）；
# `blocking` 是给下载线程用的 —— 下载在主线程会把界面冻住，见 update.rs
reqwest = { version = "0.13.5", default-features = false, features = ["json", "blocking", "rustls"] }
# 安装包校验：只信 GitHub Asset 的 digest，下完与安装前各算一次
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
# 0.4.28：`s` → `3`。这个软件的热路径是图片解码/编码（libwebp / zune-jpeg）、xxh3 哈希和 SQLite，
# 体积优化(`s`)在这些循环上会明显减速；发布版安装包本来就只有 ~5 MB，值得换性能。
# 代价：exe/安装包略大、全量编译更久（LTO 下两者本来就慢，不影响日常增量）。
opt-level = 3
strip = true
